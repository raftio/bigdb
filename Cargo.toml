[workspace]
resolver = "2"
members = [
    "crates/big-civil",
    "crates/big-container",
    "crates/big-page",
    "crates/big-pager",
    "crates/big-btree",
    "crates/big-engine",
    "crates/big-keys",
    "crates/big-rbac",
    "crates/big-db",
    "crates/big-plan",
    "crates/big-sql",
    "crates/big-testfile",
    "crates/big-exec",
    "crates/big-embed",
    "crates/big-tls",
    "crates/big-wire",
    "crates/big-cluster",
    "crates/big-http",
    # One address in front of many nodes. It ships an executable of its own rather than a third
    # `[[bin]]` in `big-bin`, because the point of it is that it opens no file and links no
    # engine, and a shared package would make that unobservable from outside.
    "crates/big-proxy",
    # Everything else that ships as an executable: `big` and `bigctl`.
    "crates/big-bin",
    "crates/big-e2e",
    # Not part of the engine: it pulls in rival engines to measure against.
    "bench",
    # Not part of the engine either, and the other direction: these are written *against* the
    # server's HTTP surface, the way somebody outside this repository would write them. Their
    # `[dependencies]` sections are empty, which is what keeps that claim checkable.
    "contrib/big-message",
    "contrib/big-message-redis",
]
# cargo-fuzz needs nightly; the engine itself stays on stable.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/raftio/bigdb"

# Every internal crate named once. The version here is the one a release has to move, rather
# than the same string repeated on thirty dependency lines where one can be missed. Paths
# resolve from the workspace root, which is why `bench` no longer needs its own spelling of the
# same dependency.
[workspace.dependencies]
big-btree = { path = "crates/big-btree", version = "0.1.0" }
big-civil = { path = "crates/big-civil", version = "0.1.0" }
big-cluster = { path = "crates/big-cluster", version = "0.1.0" }
big-container = { path = "crates/big-container", version = "0.1.0" }
big-db = { path = "crates/big-db", version = "0.1.0" }
big-embed = { path = "crates/big-embed", version = "0.1.0" }
big-engine = { path = "crates/big-engine", version = "0.1.0" }
big-exec = { path = "crates/big-exec", version = "0.1.0" }
big-http = { path = "crates/big-http", version = "0.1.0" }
big-keys = { path = "crates/big-keys", version = "0.1.0" }
big-page = { path = "crates/big-page", version = "0.1.0" }
big-pager = { path = "crates/big-pager", version = "0.1.0" }
big-plan = { path = "crates/big-plan", version = "0.1.0" }
big-proxy = { path = "crates/big-proxy", version = "0.1.0" }
big-rbac = { path = "crates/big-rbac", version = "0.1.0" }
big-sql = { path = "crates/big-sql", version = "0.1.0" }
big-tls = { path = "crates/big-tls", version = "0.1.0" }
big-wire = { path = "crates/big-wire", version = "0.1.0" }
# No version: `publish = false`, so it can only ever be reached by path.
big-testfile = { path = "crates/big-testfile" }
big-message = { path = "contrib/big-message" }
big-message-redis = { path = "contrib/big-message-redis" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
lto = "thin"
codegen-units = 1
