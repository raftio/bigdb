# `kubectl apply -k deploy/k8s` - after `./secrets.sh`, which is not listed here.
#
# **The Secrets are made by a script and not generated by kustomize**, on purpose. A
# `secretGenerator` would name them `big-node-a-<hash>` and roll the pods on every change, which
# for a credential file is usually the right instinct and here is not: rotating a node's
# certificate by restarting every node at once takes both ranges down, and the users file is
# read at startup anyway, so a rollout is a decision to make deliberately rather than a side
# effect of `apply`. It also keeps a private key out of every rendered manifest anybody pipes to
# a file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: big

resources:
  - 00-namespace.yaml
  - 10-config.yaml
  - 20-nodes.yaml
  - 30-proxy.yaml
