# Two nodes, a range each. See cluster.toml for the shape and docs/clustering.md for why it is
# that shape.
#
#   cd deploy/cluster
#   ./users.sh                  # writes secrets/users, mode 600, and prints the passwords
#   ./certs.sh                  # writes secrets/peer-ca.pem and one certificate per node
#   docker compose up -d
#   curl -u ops:$PASSWORD localhost:7654/ready      # the proxy's own, and the rotation
#   curl -u ops:$PASSWORD localhost:7654/verify
#
# The published port is plaintext on loopback, which is why it is published on 127.0.0.1 and
# nowhere else. Nodes speak TLS to each other regardless - that is what the certificates are
# for - and a deployment reachable from anywhere else needs --tls-cert on the published node
# too, or a proxy in front of it.
#
# Any node answers any request: the one that receives it plans the query and fans it out — so a
# client never had to choose. What it did have to do, until there was a proxy, was pick *one*
# address and keep using it: the clients hold one connection to one host and have no failover.
# So the published port is `proxy` now. A client still sees one address; it is no longer one
# machine.
#
# **Nothing here is replicated, and that is a choice with a price.** Each range lives on exactly
# one node, so `stop b` leaves `64..` unanswerable until it comes back: the proxy picks a node
# that is up, it cannot pick data that is not there. Failing over needs a copy of a range, and a
# copy needs a third node to settle the vote - see docs/clustering.md, "Replication, and failing
# over", and deploy/readme.md, "What a joining node needs first", for what adds one.

# Everything the two nodes share. Not the volumes: a merge key replaces a list rather than
# extending it, so a `volumes` here would be silently overridden by each service's own and read
# as though it applied.
x-node: &node
  build:
    context: ../..
  restart: unless-stopped
  # **The image's own health check speaks HTTP, and this port does not.** It is written for the
  # single-node deployment, where the port is in the clear; here the same request is answered
  # `400` and every container goes `unhealthy` while the cluster is perfectly well. Same probe,
  # one scheme over.
  #
  # `-k` is deliberate: the certificate names the node - `DNS:a` - and this request is to
  # `127.0.0.1` from inside that node's own container. What is being asked is "can this process
  # answer", not "is this the right process", and it never leaves the container to ask it.
  healthcheck:
    test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:7654/health"]
    interval: 10s
    timeout: 2s
    start_period: 5s
    retries: 3
  # Nothing to flush and nothing to replay: the meta page flip is the only atomic point, so a
  # process killed outright leaves a file that is either before it or after it.
  stop_grace_period: 2s

services:
  a:
    <<: *node
    # **No `ports:`, and that is the change the proxy makes.** Publishing one node made that
    # node a single point of failure for machines that were all healthy — the clients hold one
    # connection to one address and do not fail over. The published port is `proxy` now.
    volumes:
      - a-data:/data
      - ./cluster.toml:/etc/big/cluster.toml:ro
      # `users` is who may talk to this node and what they may do. The certificates are how the
      # nodes prove themselves to each other, which is a separate question with a separate
      # answer - there is no shared credential here at all. The directory is mounted, never the
      # files: see deploy/entrypoint.sh for both halves of why.
      - ./secrets:/etc/big/secrets:ro
    command:
      - /data/big.db
      - 0.0.0.0:7654
      - --cluster
      - /etc/big/cluster.toml
      # Which entry in the file this daemon is. Needed because the address it binds -
      # 0.0.0.0:7654 - is not the address the others reach it on.
      - --node
      - a
      - --users
      # Staged from the mount by the entrypoint, which reads it as root and writes a private
      # copy: a bind mount carries the host's ownership, which the image cannot predict.
      - /run/big/users
      # What this node presents to the other node. The CA that checks it is named in cluster.toml,
      # because that half is the same everywhere; these two are this node's alone.
      - --peer-cert
      - /run/big/peer.pem
      - --peer-key
      - /run/big/peer.key
      # **Set it on a new deployment.** There is no default, on purpose - a query that used to
      # finish must not start failing because the server was upgraded - but a daemon with no
      # ceiling is a daemon one expensive query can hold a worker on for as long as it likes.
      - --query-timeout
      - "30"
      # **The same certificate again, and this is the pair that makes the cluster work.**
      # `--peer-cert` is the identity this node presents when it *dials* another; `--tls-cert` is
      # what its own listener presents when it is dialled. A node given only the first speaks TLS
      # outward into a plaintext port and every peer handshake fails - `received corrupt message
      # of type InvalidContentType`, an election that never settles, `serving: false`. One
      # listener serves peers and people both, so there is one certificate for both, and
      # `certs.sh` issues it with `serverAuth` and `clientAuth` for exactly this reason.
      #
      # It also means the published port is HTTPS: `bigctl --addr https://... --ca-file` rather
      # than a bare host:port. Client certificates are optional on this listener, so a person
      # with no certificate still connects and still authenticates with a password.
      - --tls-cert
      - /run/big/peer.pem
      - --tls-key
      - /run/big/peer.key
      # Per node, because a backup is per node: each holds its own range, and a copy of one node
      # is a copy of one range. `big backup` cannot do this while the daemon runs - it wants the
      # exclusive lock the daemon holds - so `POST /admin/backup` is the online path.
      - --backup-dir
      - /data

  b:
    <<: *node
    volumes:
      - b-data:/data
      - ./cluster.toml:/etc/big/cluster.toml:ro
      - ./secrets:/etc/big/secrets:ro
    command:
      - /data/big.db
      - 0.0.0.0:7654
      - --cluster
      - /etc/big/cluster.toml
      - --node
      - b
      - --users
      # Staged from the mount by the entrypoint, which reads it as root and writes a private
      # copy: a bind mount carries the host's ownership, which the image cannot predict.
      - /run/big/users
      # What this node presents to the other node. The CA that checks it is named in cluster.toml,
      # because that half is the same everywhere; these two are this node's alone.
      - --peer-cert
      - /run/big/peer.pem
      - --peer-key
      - /run/big/peer.key
      # **Set it on a new deployment.** There is no default, on purpose - a query that used to
      # finish must not start failing because the server was upgraded - but a daemon with no
      # ceiling is a daemon one expensive query can hold a worker on for as long as it likes.
      - --query-timeout
      - "30"
      # **The same certificate again, and this is the pair that makes the cluster work.**
      # `--peer-cert` is the identity this node presents when it *dials* another; `--tls-cert` is
      # what its own listener presents when it is dialled. A node given only the first speaks TLS
      # outward into a plaintext port and every peer handshake fails - `received corrupt message
      # of type InvalidContentType`, an election that never settles, `serving: false`. One
      # listener serves peers and people both, so there is one certificate for both, and
      # `certs.sh` issues it with `serverAuth` and `clientAuth` for exactly this reason.
      #
      # It also means the published port is HTTPS: `bigctl --addr https://... --ca-file` rather
      # than a bare host:port. Client certificates are optional on this listener, so a person
      # with no certificate still connects and still authenticates with a password.
      - --tls-cert
      - /run/big/peer.pem
      - --tls-key
      - /run/big/peer.key
      # Per node, because a backup is per node: each holds its own range, and a copy of one node
      # is a copy of one range. `big backup` cannot do this while the daemon runs - it wants the
      # exclusive lock the daemon holds - so `POST /admin/backup` is the online path.
      - --backup-dir
      - /data

  # The front door. One address, two nodes behind it, and a request that lands on a node which
  # has stopped serving lands somewhere else instead.
  #
  # It adds no routing: every node already plans a query and fans it out, so this answers "which
  # node is alive" and nothing more. What it does add is a route allowlist — `/internal/*` is
  # unreachable through it, and cannot be made reachable, because it presents no client
  # certificate either.
  proxy:
    build:
      context: ../..
      dockerfile: deploy/proxy/Dockerfile
    restart: unless-stopped
    # The only published port. Loopback only, for the same reason the node's was: this hop is in
    # the clear. Add --tls-cert and --tls-key before publishing it wider.
    ports:
      - "127.0.0.1:7654:7650"
    depends_on: [a, b]
    volumes:
      # The same file the nodes read. This takes `name` and `addr` out of it and ignores the
      # rest — it does not route by key, so the shard map is none of its business. One file, so
      # a node that moves moves once.
      - ./cluster.toml:/etc/bigproxy/cluster.toml:ro
      # `peer-ca.pem` only, and only to *verify* the nodes' certificates. A certificate signed
      # by that CA would name a node and would reach /internal/*; there is deliberately no flag
      # that loads one. Trusting a CA is not being trusted by it.
      - ./secrets:/etc/bigproxy/secrets:ro
    command:
      - 0.0.0.0:7650
      - --cluster
      - /etc/bigproxy/cluster.toml
      - --upstream-ca
      - /run/bigproxy/peer-ca.pem
      # Published to 127.0.0.1 above, so the clear-text hop is inside one machine. Drop this and
      # add --tls-cert before publishing it wider.
      - --insecure-no-tls
    healthcheck:
      # Liveness. A proxy whose upstreams are all down is still a healthy proxy: it is answering,
      # and `503` is the correct answer. `/ready` is where an orchestrator asks the other
      # question, and restarting this would not bring a database back.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7650/health"]
      interval: 10s
      timeout: 2s
      start_period: 5s
      retries: 3
    stop_grace_period: 2s

# One volume per node. **Not one shared between them**: one process holds one file - the pager
# takes an exclusive lock - and two nodes pointed at one volume is two nodes fighting over a
# database that only one of them can open.
volumes:
  a-data:
  b-data:
