# Three nodes, one of them a copy. See cluster.toml for the shape and docs/clustering.md for
# why it is that shape.
#
#   cd deploy/cluster
#   ./users.sh                  # writes secrets/users, mode 600, and prints the passwords
#   ./certs.sh                  # writes secrets/peer-ca.pem and one certificate per node
#   docker compose up -d
#   curl -u ops:$PASSWORD localhost:7654/ready
#   curl -u ops:$PASSWORD localhost:7654/verify
#
# The published port is plaintext on loopback, which is why it is published on 127.0.0.1 and
# nowhere else. Nodes speak TLS to each other regardless - that is what the certificates are
# for - and a deployment reachable from anywhere else needs --tls-cert on the published node
# too, or a proxy in front of it.
#
# Any node answers any request: the one that receives it plans the query and fans it out. Only
# `a` is published, because publishing three ports would suggest a client has to choose, and it
# does not.

# Everything the three nodes share. Not the volumes: a merge key replaces a list rather than
# extending it, so a `volumes` here would be silently overridden by each service's own and read
# as though it applied.
x-node: &node
  build:
    context: ../..
  restart: unless-stopped
  # Nothing to flush and nothing to replay: the meta page flip is the only atomic point, so a
  # process killed outright leaves a file that is either before it or after it.
  stop_grace_period: 2s

services:
  a:
    <<: *node
    ports:
      - "127.0.0.1:7654:7654"
    volumes:
      - a-data:/data
      - ./cluster.toml:/etc/big/cluster.toml:ro
      # `users` is who may talk to this node and what they may do. The certificates are how the
      # nodes prove themselves to each other, which is a separate question with a separate
      # answer - there is no shared credential here at all. The directory is mounted, never the
      # files: see deploy/entrypoint.sh for both halves of why.
      - ./secrets:/etc/big/secrets:ro
    command:
      - /data/big.db
      - 0.0.0.0:7654
      - --cluster
      - /etc/big/cluster.toml
      # Which entry in the file this daemon is. Needed because the address it binds -
      # 0.0.0.0:7654 - is not the address the others reach it on.
      - --node
      - a
      - --users
      # Staged from the mount by the entrypoint, which reads it as root and writes a private
      # copy: a bind mount carries the host's ownership, which the image cannot predict.
      - /run/big/users
      # What this node presents to the other two. The CA that checks it is named in cluster.toml,
      # because that half is the same everywhere; these two are this node's alone.
      - --peer-cert
      - /run/big/peer.pem
      - --peer-key
      - /run/big/peer.key
      # **Set it on a new deployment.** There is no default, on purpose - a query that used to
      # finish must not start failing because the server was upgraded - but a daemon with no
      # ceiling is a daemon one expensive query can hold a worker on for as long as it likes.
      - --query-timeout
      - "30"

  b:
    <<: *node
    volumes:
      - b-data:/data
      - ./cluster.toml:/etc/big/cluster.toml:ro
      - ./secrets:/etc/big/secrets:ro
    command:
      - /data/big.db
      - 0.0.0.0:7654
      - --cluster
      - /etc/big/cluster.toml
      - --node
      - b
      - --users
      # Staged from the mount by the entrypoint, which reads it as root and writes a private
      # copy: a bind mount carries the host's ownership, which the image cannot predict.
      - /run/big/users
      # What this node presents to the other two. The CA that checks it is named in cluster.toml,
      # because that half is the same everywhere; these two are this node's alone.
      - --peer-cert
      - /run/big/peer.pem
      - --peer-key
      - /run/big/peer.key
      # **Set it on a new deployment.** There is no default, on purpose - a query that used to
      # finish must not start failing because the server was upgraded - but a daemon with no
      # ceiling is a daemon one expensive query can hold a worker on for as long as it likes.
      - --query-timeout
      - "30"

  a-spare:
    <<: *node
    volumes:
      - spare-data:/data
      - ./cluster.toml:/etc/big/cluster.toml:ro
      - ./secrets:/etc/big/secrets:ro
    command:
      - /data/big.db
      - 0.0.0.0:7654
      - --cluster
      - /etc/big/cluster.toml
      - --node
      - a-spare
      - --users
      # Staged from the mount by the entrypoint, which reads it as root and writes a private
      # copy: a bind mount carries the host's ownership, which the image cannot predict.
      - /run/big/users
      # What this node presents to the other two. The CA that checks it is named in cluster.toml,
      # because that half is the same everywhere; these two are this node's alone.
      - --peer-cert
      - /run/big/peer.pem
      - --peer-key
      - /run/big/peer.key
      # **Set it on a new deployment.** There is no default, on purpose - a query that used to
      # finish must not start failing because the server was upgraded - but a daemon with no
      # ceiling is a daemon one expensive query can hold a worker on for as long as it likes.
      - --query-timeout
      - "30"

# One volume per node. **Not one shared between them**: one process holds one file - the pager
# takes an exclusive lock - and two nodes pointed at one volume is two nodes fighting over a
# database that only one of them can open.
volumes:
  a-data:
  b-data:
  spare-data:
