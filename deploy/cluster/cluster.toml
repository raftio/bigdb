# Two nodes: a range each, and no copy of either.
#
# Nothing here is replicated, so nothing fails over - a node that stops takes its range with it
# until it comes back. A copy would need a third node and not a second: failing over is a
# decision a majority has to agree on, and a majority of two is two, so two machines can never
# use a copy they hold. See docs/clustering.md, "Replication, and failing over".
#
# The addresses are the compose service names. Inside the network each node listens on
# 0.0.0.0:7654 and reaches the others by name, which is why each one is started with --node:
# the address it binds is not the address the others use to find it.
#
# **This file is a seed, not the truth.** It says what the cluster was when it started; every
# committed decision after that replaces it - a range that split, a range that moved, a node that
# joined or was removed. So a node that has been running does not have its file rewritten to
# match, and two nodes of one cluster legitimately hold different ones. See
# docs/clustering.md, "Changing the shape while it runs", and `deploy/readme.md` for the
# commands that make those decisions.

# **What names this cluster**, and the reason it is here rather than left out: a node that joins
# at runtime is given a file describing a different set of nodes - itself and whoever it was told
# about - so the shape of the file can no longer be what two nodes recognise each other by. With
# a `cluster_id` they check this instead, and a node admitted next year matches one started
# today. Without one the shape is still used, which is exact for a cluster that never grows.
#
# Any string, the same on every node. Change it and the nodes stop recognising each other, so it
# is written once and left alone.
cluster_id      = "big-demo"

schema_leader   = "a"
# **Who signs a node certificate**, staged from the mount by the entrypoint - see
# deploy/entrypoint.sh. Shared by every node, which is why it is here: one file cannot name node
# `a`'s private key without also naming node `b`'s, so the certificate and key each node presents
# are `big serve` flags (--peer-cert, --peer-key) rather than entries in this file.
#
# This replaced `peer_token_file`, which held one `admin` credential every node presented to
# every other. A certificate says which node is speaking; a shared string could not.
peer_ca_file = "/run/big/peer-ca.pem"

# **And what that CA has taken back.** `certs.sh` writes an empty list at bootstrap and the
# entrypoint stages it, so revocation is wired up before anybody needs it - a cluster that has
# never had a CRL cannot start checking one without restarting every node, and the moment a key
# leaks is the worst moment to discover that. Reissue the list naming a serial to retire one
# node's certificate; the nodes read it at startup, so it lands on a rolling restart.
peer_crl_file = "/run/big/peer-ca.crl"

[[node]]
name   = "a"
addr   = "a:7654"
shards = "0..64"

[[node]]
name   = "b"
addr   = "b:7654"
shards = "64.."
