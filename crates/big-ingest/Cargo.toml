[package]
name = "big-ingest"
description = "bigi: a batch loader for a running bigd - one file, one route, many requests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
keywords = ["bitmap","index","database","client","ingest"]
categories = ["database","command-line-utilities"]

# One dependency, and it is the crate whose own `[dependencies]` section is empty. Depending on
# `big-cli` therefore leaves the graph proving exactly what that empty section exists to prove -
# this binary cannot link the engine, so it cannot validate a line before sending it and cannot
# grow an offline path. What it buys is that the HTTP writer, the JSON reader, the URL escape
# and the token-file check are the ones `bigc` uses rather than second copies that can drift.
[dependencies]
big-cli = { path = "../big-cli", version = "0.1.0" }

# The server, for tests only. They drive a real `bigd` in-process on a loopback port, because
# the property worth testing here - a file larger than one request still lands, and lands once -
# is not observable against a mock.
[dev-dependencies]
big-api = { path = "../big-api", version = "0.1.0" }
big-db = { path = "../big-db", version = "0.1.0" }
big-http = { path = "../big-http", version = "0.1.0" }
# Only to name the pager the in-memory database is built over.
big-pager = { path = "../big-pager", version = "0.1.0" }
tempfile = "3"

[[bin]]
name = "bigi"
path = "src/bin/bigi.rs"
