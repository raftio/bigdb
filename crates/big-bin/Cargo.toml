[package]
name = "big-bin"
description = "The two binaries big ships: the daemon and offline tool `big`, and the client `bigctl`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"
keywords = ["bitmap","index","database","cli","command-line-utilities"]
categories = ["database","command-line-utilities"]

# Everything shipped as an executable lives here, and the two binaries below are the whole of
# it. They were four, in four packages, which meant an operator had to know which name held the
# exclusive lock before they could find out that the other one could not have it.
#
# **This crate links the engine, and so does `bigctl`.** That is a deliberate loss. The client
# used to be its own package with an empty `[dependencies]` section, which made "the client
# cannot grow an offline query path" a fact about the dependency graph rather than a rule
# somebody remembers. Cargo gives every `[[bin]]` of a package the same dependencies, so one
# package for both binaries is one package that links `big-http` - and nothing now stops a
# future `use big_sql` in `bigctl`. What is left is the rule written down here and in
# `architecture.md`: the client sends bytes and prints what comes back. It parses no SQL.

# **This is where TLS is turned on**, and the only place in the workspace that does. A library
# that dragged rustls in behind its callers would be taking the choice away from them; a shipped
# daemon that cannot speak TLS is not much of a daemon. So the libraries forward the feature and
# the binaries decide. `cargo check -p big-bin --no-default-features` is asserted in CI, which is
# what keeps the other answer real rather than theoretical.
[features]
default = ["tls"]
tls = ["big-http/tls", "big-cluster/tls", "big-tls/tls"]

[dependencies]
big-embed.workspace = true
big-cluster.workspace = true
big-db.workspace = true
big-http.workspace = true
big-pager.workspace = true
big-tls.workspace = true
# For turning terminal echo off while a password is typed. One of the four dependencies the
# engine already had; a crate for two ioctls would be a fifth for less code than its manifest.
libc = "0.2"
# **The argument parser, and a reversal.** Both binaries used to hand-roll one, and the module
# docs said in as many words that a surface this size did not justify a dependency. That was
# true when it was eight options. It stopped being true somewhere around thirty-five on
# `big serve` and a two-phase parser on `bigctl` that had to re-implement subcommand scoping by
# hand - `only()`, which existed because flags were once collected into one flat list and
# silently dropped wherever they meant nothing. A parser that has to grow its own bug class is
# not cheaper than the crate, and clap gives that check away for free.
#
# The feature set is pinned in `[workspace.dependencies]` at the root, not here, so that
# `bigproxy` cannot end up with a different one.
clap.workspace = true

[dev-dependencies]
# The client tests drive a real server in-process on a loopback port rather than a mock,
# because the one thing worth testing there is agreement with what the server actually writes.
# Every crate they need is already a dependency above; only the scratch directory is not.
tempfile = "3"
# Certificates for the TLS tests, generated per run. A fixture certificate expires, and a test
# that starts failing in 2036 is a landmine left for somebody who will not know what it guarded.
rcgen = "0.13"

# `big` holds the file: it serves it, or it takes the exclusive lock and works on it offline.
[[bin]]
name = "big"
path = "src/bin/big.rs"

# `bigctl` holds nothing. It asks a running `big serve` over HTTP and prints the answer.
[[bin]]
name = "bigctl"
path = "src/bin/bigctl.rs"
