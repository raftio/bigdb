[package]
name = "big-cluster"
description = "Static shard ownership, the fan-out over it, and the wire it travels on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"

# Above `big-embed` and below `big-http`, which is the whole reason this is its own crate: the
# merge has to be written somewhere that has never heard of a socket handler and somewhere
# `big-db` has never heard of. Neither of those places existed.
[features]
default = []
tls = ["big-tls/tls"]

[dependencies]
# The socket a peer is reached over, plain or TLS. Forwarded, not turned on: `big-bin` decides.
big-tls.workspace = true
big-civil.workspace = true
big-embed.workspace = true
# The privilege mask a `SetGrant` carries over the wire.
big-rbac.workspace = true
big-container.workspace = true
big-db.workspace = true
big-exec.workspace = true
big-engine.workspace = true
big-pager.workspace = true
big-plan.workspace = true
bytemuck = "1"

[dev-dependencies]
big-testfile.workspace = true
proptest = "1"
# The agreement writes its state to a file, and a test of that needs somewhere to put one.
tempfile = "3"
