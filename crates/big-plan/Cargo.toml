[package]
name = "big-plan"
description = "Query language and planner for big: parse, resolve against a schema, type check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"

# No storage dependencies on purpose. A planner that has to link a memory-mapped file to run its
# tests is a planner nobody tests. `big-civil` is calendar arithmetic and nothing else - no
# files, no pages, no engine - and the planner needs it to know what `'2024-01-15'` is.
[dependencies]
big-civil.workspace = true

[dev-dependencies]
proptest = "1"
