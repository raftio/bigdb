[package]
name = "big-cli"
description = "bigc: a command-line client for a running bigd, and nothing more"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"

# No dependencies, and the empty section is the point rather than an accident. A client that
# cannot link the engine cannot grow an offline query path, so "the client adds no vocabulary"
# is enforced by the dependency graph instead of by discipline.
[dependencies]

# The server, for tests only. They drive a real `bigd` in-process on a loopback port rather than
# a mock, because the one thing worth testing here is agreement with what the server actually
# writes.
[dev-dependencies]
big-api = { path = "../big-api", version = "0.1.0" }
big-http = { path = "../big-http", version = "0.1.0" }
big-db = { path = "../big-db", version = "0.1.0" }
big-pager = { path = "../big-pager", version = "0.1.0" }

[[bin]]
name = "bigc"
path = "src/bin/bigc.rs"
