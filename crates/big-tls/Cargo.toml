[package]
name = "big-tls"
description = "The socket a request arrives on, plain or TLS, and what it proves about the caller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "readme.md"

# **Off by default, and that is the point.** With the feature off this crate has no dependencies
# at all and `Wire` is a `TcpStream` behind one `match`, so `big-http` and `big-cluster` keep the
# tree they had. `big-bin` turns it on, because a shipped daemon that cannot speak TLS is not
# much of a daemon. Every `#[cfg(feature = "tls")]` in the workspace lives in this crate.
[features]
default = []
tls = ["dep:rustls", "dep:rustls-webpki"]

[dependencies]
# `ring` rather than the default `aws-lc-rs`: the build image is `rust:1.88-bookworm`, which has
# a C compiler and no `cmake`. No `tls12` either - both ends of every connection here are ours or
# a modern curl, and a protocol version left out is a protocol version's worth of code that
# cannot be wrong.
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "ring",
    "logging",
], optional = true }
# For the one question rustls does not answer: which node a client certificate names. rustls
# verifies chains; it does not parse subjects. Already in the lock file underneath rustls, so
# naming it here adds nothing to the tree - it only makes the dependency visible to an audit.
#
# The certificate types come through `rustls::pki_types`, which is `rustls-pki-types` re-exported.
# Depending on it a second time by name would be one more version for cargo to have to unify.
rustls-webpki = { version = "0.103", default-features = false, features = [
    "std",
    "ring",
], optional = true }

[dev-dependencies]
# Certificates are generated by the tests that need them rather than checked in. A fixture
# certificate expires, and a test that starts failing in 2036 is a landmine left for somebody
# who will have no idea what it was guarding.
rcgen = "0.13"
tempfile = "3"
