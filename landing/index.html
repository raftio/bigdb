<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bigdb — a bitmap-native analytical database</title>
<meta name="description" content="Every fact is one bit at (row, record). A filter is an intersection. A count is a popcount. Anything unsupported is refused by name, at parse time.">
<link rel="icon" href="/bigdb-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script>
  /* Set the theme before first paint so there is no flash of the wrong one. */
  (function(){try{var m=localStorage.getItem("bigdb-theme");if(m!=="light"&&m!=="dark"){m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}document.documentElement.classList.toggle("dark",m==="dark")}catch(e){document.documentElement.classList.add("dark")}})()
</script>
</head>
<body>
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-3 focus:top-3 focus:z-50 focus:rounded focus:bg-accent focus:px-3 focus:py-1.5 focus:text-accent-fg">Skip to content</a>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
